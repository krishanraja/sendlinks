<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>mind/make</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a100d;
    --ink-raised: #121a16;
    --ink-line: #24302a;
    --cream: #f3ecdf;
    --cream-dim: #b9b2a5;
    --mint: #7fe0b6;
    --mint-ink: #0a100d;
    --amber: #f0b45a;
    --bg: var(--ink);
    --surface: var(--ink-raised);
    --line: var(--ink-line);
    --text: var(--cream);
    --muted: var(--cream-dim);
    --action: var(--mint);
    --action-text: var(--mint-ink);
    --focus: var(--mint);
  }
  :root[data-theme="light"] {
    --bg: #f3ecdf;
    --surface: #fbf7ef;
    --line: #ddd3c2;
    --text: #0a100d;
    --muted: #5b5d55;
    --action: #0f5c3d;
    --action-text: #f3ecdf;
    --focus: #0f5c3d;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3ecdf; --surface: #fbf7ef; --line: #ddd3c2; --text: #0a100d;
      --muted: #5b5d55; --action: #0f5c3d; --action-text: #f3ecdf; --focus: #0f5c3d;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100svh;
    background: var(--bg);
    color: var(--text);
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 18px;
    line-height: 1.55;
    display: flex;
    flex-direction: column;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px; letter-spacing: .04em; }
  header { display: flex; align-items: center; justify-content: space-between; max-width: 560px; width: 100%; margin: 0 auto; }
  .wordmark { font-family: "Archivo", system-ui, sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -.01em; }
  .wordmark span { color: var(--action); }
  .who { color: var(--muted); }
  main { flex: 1; display: flex; align-items: center; }
  .card {
    max-width: 560px; width: 100%; margin: 40px auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px 24px 24px;
  }
  .kicker { color: var(--muted); text-transform: uppercase; margin: 0 0 14px; }
  h1 {
    font-family: "Newsreader", Georgia, serif; font-weight: 500;
    font-size: clamp(30px, 7vw, 40px); line-height: 1.12; letter-spacing: -.01em;
    margin: 0 0 14px;
  }
  .note { margin: 0 0 22px; color: var(--text); }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted); margin: 0 0 24px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .meta b { color: var(--text); font-weight: 500; }
  .action {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: 100%; min-height: 56px; border: 0; border-radius: 10px;
    background: var(--action); color: var(--action-text);
    font-family: "Archivo", system-ui, sans-serif; font-weight: 700; font-size: 18px;
    cursor: pointer;
  }
  .action:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .play { width: 0; height: 0; border-left: 13px solid currentColor; border-top: 8px solid transparent; border-bottom: 8px solid transparent; }
  label { display: block; margin: 0 0 8px; color: var(--muted); }
  input[type=password] {
    width: 100%; min-height: 52px; margin: 0 0 14px; padding: 0 14px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--text); font-size: 18px; font-family: "IBM Plex Mono", monospace;
  }
  .fine { color: var(--muted); margin: 18px 0 0; font-size: 15px; line-height: 1.5; }
  footer { max-width: 560px; width: 100%; margin: 0 auto; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; }
  [hidden] { display: none !important; }

  video, audio { width: 100%; max-height: 72svh; object-fit: contain; border-radius: 10px; background: #000; margin: 0 0 6px; display: block; }
  .textbody { white-space: pre-wrap; margin: 0 0 8px; }
  .err { color: var(--amber); margin: 0 0 12px; }
  .action[disabled] { opacity: .6; cursor: progress; }
  .skeleton { color: var(--muted); }
</style>
<!-- config.js sets window.SENDLINKS_OPEN_BASE at deploy; it is not in the repository. -->
<script src="./config.js"></script>
</head>
<body>
  <header>
    <div class="wordmark">mind<span>/</span>make</div>
    <div class="mono who" id="who"></div>
  </header>

  <main>
    <section class="card" aria-labelledby="t" aria-live="polite">
      <p class="mono kicker" id="kicker">A link sent to you</p>
      <h1 id="t" class="skeleton">Opening</h1>

      <div data-state="ready" hidden>
        <p class="note" id="note"></p>
        <p class="mono meta" id="meta"></p>
        <div id="stage"></div>
        <button class="action" type="button" id="go"></button>
        <p class="fine">This link is for you alone. When you open it, mind/make sees that it reached you.</p>
      </div>

      <form data-state="password" hidden id="pwform">
        <p class="note">This one is locked. The password came with the message that brought you here.</p>
        <p class="err" id="pwerr" hidden></p>
        <label class="mono" for="pw">PASSWORD</label>
        <input id="pw" type="password" autocomplete="off" required>
        <button class="action" type="submit" id="pwgo">Open</button>
        <p class="fine" id="pwfine">Ten wrong tries lock the link.</p>
      </form>

      <div data-state="gone" hidden>
        <p class="note" id="gonenote"></p>
        <p class="mono meta" id="gonemeta" hidden></p>
      </div>
    </section>
  </main>

  <footer class="mono">
    <span>mindmake.co</span>
    <span>Sent by mind/make</span>
  </footer>

<script>
(() => {
  const BASE = String(window.SENDLINKS_OPEN_BASE || "").replace(/\/$/, "");
  const parts = location.pathname.split("/").filter(Boolean);
  const token = new URLSearchParams(location.search).get("t") || parts[parts.length - 1] || "";
  const openUrl = BASE + "/" + token;
  const $ = (id) => document.getElementById(id);
  const show = (name) => document.querySelectorAll("[data-state]").forEach((el) => { el.hidden = el.dataset.state !== name; });
  const day = (iso) => new Date(iso).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  const size = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + " MB" : n >= 1e3 ? Math.round(n / 1e3) + " KB" : n + " bytes";
  const GONE = {
    expired: "This link has closed. Reply to the message it came in to ask for a fresh one.",
    revoked: "This link has been withdrawn.",
    exhausted: "This link has already been opened as many times as it allows.",
    locked: "This link is locked after too many wrong passwords. Reply to the message it came in.",
    not_found: "This link does not exist. Check that the whole address came through.",
  };
  const gone = (reason, card) => {
    $("t").classList.remove("skeleton");
    if (card && card.title) $("t").textContent = card.title; else $("t").textContent = "This link is not available";
    $("gonenote").textContent = GONE[reason] || "This link cannot be opened just now. Try again in a minute.";
    if (card && card.expires_at && reason === "expired") { $("gonemeta").hidden = false; $("gonemeta").innerHTML = "Closed <b>" + day(card.expires_at) + "</b>"; }
    show("gone");
  };

  // What the card says about the thing, and what the button does.
  const describe = (c) => {
    const ct = String(c.content_type || "");
    if (c.kind === "url") return { kicker: "A link sent to you", verb: "Open the link", note: c.message || "It opens the page it points to." , label: "Web link" };
    if (c.kind === "text") return { kicker: "A note sent to you", verb: "Show the note", note: c.message || "A short note from mind/make.", label: "Note" };
    if (ct.startsWith("video/")) return { kicker: "A video sent to you", verb: "Play the video", note: "A short video from mind/make. It plays right here, with nothing to install.", label: ct.split("/")[1].toUpperCase() + " video", play: "video" };
    if (ct.startsWith("audio/")) return { kicker: "Audio sent to you", verb: "Play it", note: "It plays right here, with nothing to install.", label: "Audio", play: "audio" };
    if (ct === "application/pdf") return { kicker: "A document sent to you", verb: "Open the PDF", note: "It opens in your browser.", label: "PDF" };
    return { kicker: "A file sent to you", verb: "Download it", note: "It downloads to your device.", label: (c.file_name || "File") };
  };

  const playInline = (tag, src) => {
    const el = document.createElement(tag);
    el.controls = true; el.autoplay = true; el.setAttribute("playsinline", ""); el.preload = "auto"; el.src = src;
    $("stage").replaceChildren(el); $("go").hidden = true;
    el.addEventListener("loadedmetadata", () => el.scrollIntoView({ behavior: "smooth", block: "center" }), { once: true });
  };

  const postOpen = async (password) => {
    const res = await fetch(openUrl, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(password ? { password } : {}) });
    return res;
  };

  const showText = (body) => {
    const p = document.createElement("p"); p.className = "textbody"; p.textContent = body.text || "";
    $("stage").replaceChildren(p); $("go").hidden = true;
  };

  // A password file comes back as bytes from the POST; anything else as JSON.
  const handleUnlocked = async (res, d) => {
    const type = res.headers.get("content-type") || "";
    if (type.startsWith("application/json")) {
      const body = await res.json();
      if (body.kind === "url" && body.url) { location.href = body.url; return; }
      show("ready"); showText(body); return;
    }
    const blob = await res.blob();
    const href = URL.createObjectURL(blob);
    show("ready");
    if (d.play) { playInline(d.play, href); return; }
    const a = document.createElement("a"); a.href = href; a.download = (window.__card && window.__card.file_name) || "download"; a.click();
  };

  const start = async () => {
    if (!BASE || !/^[A-Za-z0-9_-]{43}$/.test(token)) return gone("not_found");
    let res;
    try { res = await fetch(openUrl + "/meta", { cache: "no-store" }); } catch { return gone("unavailable"); }
    const card = await res.json().catch(() => ({ ok: false, reason: "unavailable" }));
    window.__card = card;
    if (!card.ok) return gone(card.reason, card);
    const d = describe(card);
    document.title = card.title + " | mind/make";
    $("t").classList.remove("skeleton"); $("t").textContent = card.title;
    $("kicker").textContent = d.kicker;
    $("note").textContent = d.note;
    const bits = ["<span><b>" + d.label.replace(/[<>&]/g, "") + "</b></span>"];
    if (card.bytes) bits.push("<span><b>" + size(card.bytes) + "</b></span>");
    bits.push("<span>Open until <b>" + day(card.expires_at) + "</b></span>");
    $("meta").innerHTML = bits.join("");
    $("pwfine").textContent = "Ten wrong tries lock the link. Open until " + day(card.expires_at) + ".";

    if (card.has_password) {
      show("password");
      $("pwform").addEventListener("submit", async (e) => {
        e.preventDefault();
        $("pwgo").disabled = true; $("pwerr").hidden = true;
        try {
          const r = await postOpen($("pw").value);
          if (r.ok) return handleUnlocked(r, d);
          const b = await r.json().catch(() => ({}));
          if (b.reason === "bad_password") { $("pwerr").textContent = "That password is not right."; $("pwerr").hidden = false; }
          else return gone(b.reason, card);
        } catch { $("pwerr").textContent = "That did not go through. Try again."; $("pwerr").hidden = false; }
        finally { $("pwgo").disabled = false; }
      });
      return;
    }

    $("go").textContent = d.verb;
    if (d.play) $("go").insertAdjacentHTML("afterbegin", '<span class="play" aria-hidden="true"></span>');
    show("ready");
    // Nothing is opened until this click, so a scanner that loads the page spends no view.
    $("go").addEventListener("click", async () => {
      if (d.play) return playInline(d.play, openUrl);
      if (card.kind === "text") {
        $("go").disabled = true;
        try {
          const r = await postOpen(null);
          if (!r.ok) { const b = await r.json().catch(() => ({})); return gone(b.reason, card); }
          return showText(await r.json());
        } finally { $("go").disabled = false; }
      }
      location.href = openUrl;
    });
  };
  start();
})();
</script>
</body>
</html>
