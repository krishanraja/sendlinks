# Fails a pull request or a push that commits a key, a JWT, a SendLinks bearer or the
# database address (scripts/check-no-secrets.sh). Fleet integration I-01, 2026-11-14.
name: No secrets

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: no-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-no-secrets.sh
